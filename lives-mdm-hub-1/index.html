<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MDM Request Hub</title>
  <meta name="description" content="Lives Group master data workspace: requests, approvals, the SAP Business One import file and the regional purchasing view.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">▦ &nbsp; Lives Group <span>Master Data Workspace</span></div>
    <div class="topbar-actions">
      <span class="topbar-account" id="account-name" aria-label="Signed-in account"></span>
      <button type="button" class="btn small topbar-logout" data-action="logout">Log out</button>
    </div>
  </header>

  <div class="app">
    <aside class="rail" id="rail" data-open="false" aria-label="Main navigation"></aside>
    <main class="work" id="view" tabindex="-1"></main>
  </div>

  <div id="drawer-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <noscript><p style="padding:24px">This workspace needs JavaScript.</p></noscript>

  <script src="assets/session.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
